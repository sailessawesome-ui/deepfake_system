<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background and Glow Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="85" fill="url(#coreGlow)" />

  <!-- Outer Hexagonal Cyber Shield -->
  <polygon points="100,12 176,54 176,146 100,188 24,146 24,54" 
           stroke="url(#shieldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
           filter="url(#neonGlow)"/>

  <!-- Inner Technical Shield Frame -->
  <polygon points="100,24 164,60 164,140 100,176 36,140 36,60" 
           stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Reticle Corner Markers -->
  <path d="M 68 46 L 56 46 L 56 58" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
  <path d="M 132 46 L 144 46 L 144 58" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
  <path d="M 56 138 L 56 150 L 68 150" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
  <path d="M 144 138 L 144 150 L 132 150" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>

  <!-- Biometric Face Wireframe Structure -->
  <!-- Jawline & Chin -->
  <path d="M 66 84 C 66 116 80 144 100 152 C 120 144 134 116 134 84 C 134 62 120 50 100 50 C 80 50 66 62 66 84 Z" 
        stroke="url(#faceGrad)" stroke-width="2" fill="rgba(15, 23, 42, 0.45)"/>

  <!-- Digital Split / Neural Synthesis Lines -->
  <!-- Left Eye / Biometric Target -->
  <ellipse cx="86" cy="88" rx="10" ry="6" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="86" cy="88" r="2.5" fill="#00F0FF" filter="url(#neonGlow)"/>

  <!-- Right Eye / Digital Wireframe Target -->
  <polygon points="114,84 122,88 114,92 106,88" stroke="#A855F7" stroke-width="1.5" fill="none"/>
  <circle cx="114" cy="88" r="2.5" fill="#A855F7" filter="url(#neonGlow)"/>

  <!-- Nose Bridge & Apex -->
  <path d="M 100 76 L 98 104 L 102 104 Z" stroke="#38BDF8" stroke-width="1.2" fill="none"/>
  <line x1="94" y1="108" x2="106" y2="108" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Mouth Contour -->
  <path d="M 90 124 Q 100 128 110 124" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 94 128 Q 100 133 106 128" stroke="#818CF8" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Geometric Facial Landmarking Triangulation -->
  <line x1="100" y1="50" x2="86" y2="88" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.5"/>
  <line x1="100" y1="50" x2="114" y2="88" stroke="#A855F7" stroke-width="0.75" stroke-opacity="0.5"/>
  <line x1="86" y1="88" x2="98" y2="104" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.5"/>
  <line x1="114" y1="88" x2="102" y2="104" stroke="#A855F7" stroke-width="0.75" stroke-opacity="0.5"/>
  <line x1="98" y1="104" x2="90" y2="124" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.5"/>
  <line x1="102" y1="104" x2="110" y2="124" stroke="#A855F7" stroke-width="0.75" stroke-opacity="0.5"/>
  <line x1="100" y1="133" x2="100" y2="152" stroke="#6366F1" stroke-width="0.75" stroke-opacity="0.6"/>

  <!-- Forensics Radar Pulse / Scanning Ray -->
  <line x1="42" y1="96" x2="158" y2="96" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.85">
    <animate attributeName="y1" values="54;146;54" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="54;146;54" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Neural Nodes -->
  <circle cx="100" cy="50" r="3" fill="#00F0FF"/>
  <circle cx="66" cy="84" r="2.5" fill="#38BDF8"/>
  <circle cx="134" cy="84" r="2.5" fill="#A855F7"/>
  <circle cx="100" cy="152" r="3" fill="#6366F1"/>
</svg>
