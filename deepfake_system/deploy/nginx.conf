# Nginx reverse proxy — IR section 2.4.7 (Web Server: Nginx) and
# IR section 3.4.1 security requirement ("Secure Processing: the data
# sent between the user interface and the backend processing server
# should be heavily encrypted to avoid interception or manipulation").
#
# Uvicorn should never face the internet directly. Nginx terminates TLS,
# caps upload size, enforces timeouts long enough for video analysis,
# and rate-limits so one client cannot occupy every worker.
#
#   sudo cp nginx.conf /etc/nginx/sites-available/deepfake
#   sudo ln -s /etc/nginx/sites-available/deepfake /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d your-domain
#   sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=analyse:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

upstream deepfake_app {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 8;
}

server {
    listen 80;
    server_name your-domain;
    # Everything goes over TLS. No exceptions, including the API.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain;

    ssl_certificate     /etc/letsencrypt/live/your-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    # Uploaded videos are large; the app caps at 250 MB, so match it here
    # and reject anything bigger before it reaches Python.
    client_max_body_size 250M;
    client_body_buffer_size 1M;
    client_body_timeout 300s;

    # Never let an upload sit on disk in the proxy layer — the whole
    # point of the zero-retention design is that the file exists in one
    # place, briefly.
    proxy_request_buffering off;
    proxy_buffering off;

    access_log /var/log/nginx/deepfake.access.log;
    error_log  /var/log/nginx/deepfake.error.log warn;

    location /api/analyse {
        limit_req  zone=analyse burst=3 nodelay;
        limit_conn conn_per_ip 2;

        proxy_pass http://deepfake_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Analysis on CPU can take a couple of minutes on a long clip.
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    location /static/ {
        proxy_pass http://deepfake_app;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://deepfake_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
